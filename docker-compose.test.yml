services:
  postgres-test:
    image: postgres:16
    # Non-standard host port (55432) to avoid collisions with local development database
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB:       valory_test
      POSTGRES_USER:     valory_test
      POSTGRES_PASSWORD: valory_test
    # Use tmpfs for data directory: memory-backed, ephemeral, fast — ideal for integration tests
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valory_test -d valory_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    # Host ports chosen to avoid collisions with local SMTP (25, 587) and the
    # postgres-test port (55432). SDD-019 §10.1 specifies these exact values.
    ports:
      - "11025:1025"  # SMTP sink — Go integration tests send here
      - "18025:8025"  # Mailpit REST API — Go tests assert delivery here
    environment:
      MP_MAX_MESSAGES: 500
      # In-memory storage: tests start with a clean slate per run.
      MP_DATABASE: ""
    healthcheck:
      # axllent/mailpit is Alpine-based and ships wget but not curl.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10
